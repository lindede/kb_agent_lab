[project]
name = "kb-agent-lab"
version = "0.1.0"
description = "Knowledge-base agent lab (RAG + tools + LangGraph)"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.40.0",
  "chromadb>=0.5.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
agent = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
